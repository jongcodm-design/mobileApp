name: class_schedule
description: A local-first Flutter class timetable with schedule and room search.
publish_to: 'none'
version: 1.2.0+3

environment:
  # paddle_ocr_native requires Dart 3.12 and Flutter 3.44 or newer.
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  pdfx: ^2.9.2
  pdfrx: ^2.6.5
  shared_preferences: ^2.3.0
  sqflite: ^2.4.2
  flutter_local_notifications: ^21.0.0
  timezone: 0.11.2
  flutter_timezone: ^5.0.0
  paddle_ocr_native: 0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/classcue_logo.png
